services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-tourenplan}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tourenplan_dev}
      POSTGRES_DB: ${POSTGRES_DB:-tourenplan}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - '127.0.0.1:5433:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-tourenplan} -d ${POSTGRES_DB:-tourenplan}']
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
